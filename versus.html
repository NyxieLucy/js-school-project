<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOUK BRAWL — Versus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
<base target="_blank">
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div id="screen-versus" class="screen active">
    <div class="sub-wrap">

      <div class="sub-header">
        <a href="index.html" class="back-btn">&#9664; BACK</a>
        <div class="sub-title">VERSUS MODE</div>
        <div class="sub-title-ar">وضع اللاعبين</div>
      </div>

      <div class="arcade-hero-section">
        <div class="vs-panel p1-panel">
          <div class="char-info left">
            <h2 class="char-name">ISSAM</h2>
            <p class="char-origin">CASABLANCA</p>
          </div>
          <div class="panel-frame">
            <img src="assets/characters/issam/idle.png" alt="P1" class="vs-portrait" id="p1-portrait">
          </div>
          <div class="p-tag p1-tag">P1</div>
        </div>

        <div class="vs-center">
          <div class="vs-logo">VS</div>
          <div class="vs-sub">READY?</div>
        </div>

        <div class="vs-panel p2-panel">
          <div class="char-info right">
            <h2 class="char-name">NAIMA</h2>
            <p class="char-origin">FES</p>
          </div>
          <div class="panel-frame">
            <img src="assets/characters/naima/idle.png" alt="P2" class="vs-portrait" id="p2-portrait">
          </div>
          <div class="p-tag p2-tag">P2</div>
        </div>
      </div>

      <div class="versus-footer">
        <button class="start-btn" id="start-fight">
          START BRAWL
          <span class="start-sub">ابدأ العراك</span>
        </button>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/character.js"></script>
  <script src="js/background.js"></script>

  <script>
    if (typeof ROSTER === 'undefined' || ROSTER.length === 0) {
      console.error('ROSTER not loaded. Check script order.');
    }

    let p1Idx = 0;
    let p2Idx = 1;

    const p1NameEl = document.querySelector('.p1-panel .char-name');
    const p1OriginEl = document.querySelector('.p1-panel .char-origin');
    const p1ImgEl = document.getElementById('p1-portrait');

    const p2NameEl = document.querySelector('.p2-panel .char-name');
    const p2OriginEl = document.querySelector('.p2-panel .char-origin');
    const p2ImgEl = document.getElementById('p2-portrait');

    function updateDisplay() {
      if (typeof ROSTER === 'undefined' || ROSTER.length === 0) return;

      // Ensure P1 and P2 never pick the same character
      if (p1Idx === p2Idx) {
        p2Idx = (p2Idx + 1) % ROSTER.length;
        if (p2Idx === p1Idx) p2Idx = (p2Idx + 1) % ROSTER.length;
      }

      const p1 = ROSTER[p1Idx];
      const p2 = ROSTER[p2Idx];

      p1NameEl.textContent = p1.name;
      p1OriginEl.textContent = p1.origin;
      p1ImgEl.src = p1.sprites.idle;

      p2NameEl.textContent = p2.name;
      p2OriginEl.textContent = p2.origin;
      p2ImgEl.src = p2.sprites.idle;
    }

    window.addEventListener('keydown', (e) => {
      if (typeof ROSTER === 'undefined' || ROSTER.length === 0) return;

      const key = e.key.toLowerCase();

      // P1: Up/Down Arrows
      if (e.key === 'ArrowUp') {
        p1Idx = (p1Idx + 1) % ROSTER.length;
        if (p1Idx === p2Idx) p1Idx = (p1Idx + 1) % ROSTER.length;
      }
      if (e.key === 'ArrowDown') {
        p1Idx = (p1Idx - 1 + ROSTER.length) % ROSTER.length;
        if (p1Idx === p2Idx) p1Idx = (p1Idx - 1 + ROSTER.length) % ROSTER.length;
      }

      // P2: W/S Keys
      if (key === 'w') {
        p2Idx = (p2Idx + 1) % ROSTER.length;
        if (p2Idx === p1Idx) p2Idx = (p2Idx + 1) % ROSTER.length;
      }
      if (key === 's') {
        p2Idx = (p2Idx - 1 + ROSTER.length) % ROSTER.length;
        if (p2Idx === p1Idx) p2Idx = (p2Idx - 1 + ROSTER.length) % ROSTER.length;
      }

      // Back to Menu
      if (key === 'x') window.location.href = 'index.html';

      // Start Fight
      if (key === 'z' || key === 'enter') startBrawl();

      updateDisplay();
    });

    function startBrawl() {
      if (typeof ROSTER === 'undefined' || ROSTER.length === 0) return;

      const p1 = ROSTER[p1Idx];
      const p2 = ROSTER[p2Idx];

      // Store in sessionStorage for versus mode (separate from arcade localStorage)
      sessionStorage.setItem('soukbrawl_fight', JSON.stringify({
        p1CharId: p1.id,
        p2CharId: p2.id,
        mode: 'versus',
        rounds: 3
      }));

      window.location.href = 'fight.html';
    }

    document.getElementById('start-fight').addEventListener('click', startBrawl);

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      updateDisplay();
      if (typeof BackgroundAnimation !== 'undefined') {
        new BackgroundAnimation();
      }
    });
  </script>
</body>
</html>
