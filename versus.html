<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOUK BRAWL — Versus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div id="screen-versus" class="screen active">
    <div class="sub-wrap">

      <div class="sub-header">
        <a href="index.html" class="back-btn">◀ BACK</a>
        <div class="sub-title">VERSUS MODE</div>
        <div class="sub-title-ar">وضع اللاعبين</div>
      </div>

      <div class="versus-container">
        
        <div class="vs-panel p1-panel">
          <div class="char-info left">
            <h2 class="char-name">ISSAM</h2>
            <p class="char-origin">CASABLANCA</p>
          </div>
          <div class="panel-frame">
            <img src="assets/characters/issam/idle.png" alt="P1" class="vs-portrait" id="p1-portrait">
          </div>
          <div class="p-tag p1-tag">P1</div>
        </div>

        <div class="vs-center">
          <div class="vs-logo">VS</div>
          <div class="vs-sub">READY?</div>
        </div>

        <div class="vs-panel p2-panel">
          <div class="char-info right">
            <h2 class="char-name">ZARA</h2>
            <p class="char-origin">TANGIER</p>
          </div>
          <div class="panel-frame">
            <img src="assets/characters/zara/idle.png" alt="P2" class="vs-portrait" id="p2-portrait">
          </div>
          <div class="p-tag p2-tag">P2</div>
        </div>

      </div>

      <div class="versus-footer">
        <button class="start-btn" id="start-fight">
          START BRAWL
          <span class="start-sub">ابدأ العراك</span>
        </button>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/background.js"></script>
  <script>
    // Quick Logic for the Start Button
    document.getElementById('start-fight').addEventListener('click', () => {
      window.location.href = 'fight.html';
    });
  </script>
</body>
</html>
