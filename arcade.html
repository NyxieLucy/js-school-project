<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOUK BRAWL — Arcade Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div id="screen-arcade" class="screen active">
    <div class="sub-wrap">

      <div class="sub-header">
        <a href="index.html" class="back-btn">&#9664; BACK</a>
        <div class="sub-title">ARCADE MODE</div>
        <div class="sub-coins">CREDITS: <span id="credits">3</span></div>
      </div>

      <div class="arcade-hero-section">
        <div class="vs-panel p1-panel">
          <div class="char-info left">
            <h2 class="char-name">ISSAM</h2>
            <p class="char-origin">CASABLANCA</p>
          </div>
          <div class="panel-frame">
            <img src="assets/characters/issam/idle.png" alt="P1" class="vs-portrait" id="p1-portrait">
          </div>
          <div class="p-tag p1-tag">P1</div>
        </div>

        <div class="vs-center">
          <div class="vs-logo">VS</div>
          <div class="vs-sub">READY?</div>
        </div>

        <div class="vs-panel p2-panel">
          <div class="char-info right">
            <h2 class="char-name">???</h2>
            <p class="char-origin">UNKNOWN</p>
          </div>
          <div class="panel-frame">
            <img src="assets/characters/unknown.png" alt="P2" class="vs-portrait" id="p2-portrait">
          </div>
          <div class="p-tag p2-tag">P2</div>
        </div>
      </div>

      <div class="arcade-ladder">
        <div class="ladder-title">ROAD TO THE THRONE</div>
        <div class="ladder-subtitle">طريق العرش</div>

        <div class="ladder-track">
          <div class="ladder-spine"></div>
          <div class="rounds-list" id="rounds-list"></div>
        </div>
      </div>

      <div class="diff-row">
        <div class="diff-label">DIFFICULTY</div>
        <div class="diff-options">
          <button class="diff-btn active" data-diff="easy">INITIATE</button>
          <button class="diff-btn" data-diff="normal">WARRIOR</button>
          <button class="diff-btn" data-diff="hard">MASTER</button>
          <button class="diff-btn" data-diff="legend">LEGEND</button>
        </div>
      </div>

      <button class="start-btn" id="start-arcade">
        START ARCADE
        <span class="start-sub">ابدأ اللعبة</span>
      </button>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/character.js"></script>
  <script src="js/background.js"></script>
  <script src="js/main.js"></script>
  <script>
    // ROSTER is already loaded from character.js — DO NOT redeclare it with const/let
    if (typeof ROSTER === 'undefined' || ROSTER.length === 0) {
      console.error('ROSTER not loaded. Check that character.js is loaded before this script.');
    }

    let p1Idx = 0;
    let p2Idx = 1;

    const p1NameEl = document.querySelector('.p1-panel .char-name');
    const p1OriginEl = document.querySelector('.p1-panel .char-origin');
    const p1ImgEl = document.getElementById('p1-portrait');

    const p2NameEl = document.querySelector('.p2-panel .char-name');
    const p2OriginEl = document.querySelector('.p2-panel .char-origin');
    const p2ImgEl = document.getElementById('p2-portrait');

    function updateDisplay() {
      if (typeof ROSTER === 'undefined' || ROSTER.length === 0) return;

      const p1 = ROSTER[p1Idx];
      const p2 = ROSTER[p2Idx];

      p1NameEl.textContent = p1.name;
      p1OriginEl.textContent = p1.origin;
      p1ImgEl.src = p1.sprites.idle;

      if (p2) {
          p2NameEl.textContent = p2.name;
          p2OriginEl.textContent = p2.origin;
          p2ImgEl.src = p2.sprites.idle;
      } else {
          p2NameEl.textContent = '???';
          p2OriginEl.textContent = 'UNKNOWN';
          p2ImgEl.src = 'assets/characters/unknown.png';
      }

      localStorage.setItem('p1_selected_arcade', p1.id);
      localStorage.setItem('p2_selected_arcade', p2 ? p2.id : 'unknown');
    }

    // ─── Keyboard Controls ───
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (typeof ROSTER === 'undefined' || ROSTER.length === 0) return;

      // P1: Up/Down Arrows
      if (e.key === 'ArrowUp') {
        p1Idx = (p1Idx + 1) % ROSTER.length;
        updateDisplay();
      }
      if (e.key === 'ArrowDown') {
        p1Idx = (p1Idx - 1 + ROSTER.length) % ROSTER.length;
        updateDisplay();
      }

      // P2: Left/Right Arrows
      if (ROSTER.length > 1) {
          if (key === 'arrowleft') {
            p2Idx = (p2Idx - 1 + ROSTER.length) % ROSTER.length;
            if (p1Idx === p2Idx) {
                p2Idx = (p2Idx - 1 + ROSTER.length) % ROSTER.length;
            }
            updateDisplay();
          }
          if (key === 'arrowright') {
            p2Idx = (p2Idx + 1) % ROSTER.length;
            if (p1Idx === p2Idx) {
                p2Idx = (p2Idx + 1) % ROSTER.length;
            }
            updateDisplay();
          }
      }

      // Back to Menu
      if (key === 'x') {
        window.location.href = 'index.html';
      }

      // Start Fight
      if (key === 'z' || key === 'enter') {
        startArcadeFight();
      }
    });

    // ─── Difficulty Buttons ───
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // ─── Start Arcade ───
    function startArcadeFight() {
      if (typeof ROSTER === 'undefined' || ROSTER.length === 0) return;

      const p1 = ROSTER[p1Idx];
      const p2 = ROSTER.length > 1 ? ROSTER[p2Idx] : null;
      const activeDiff = document.querySelector('.diff-btn.active');

      localStorage.setItem('p1_selected_arcade', p1.id);
      localStorage.setItem('p2_selected_arcade', p2 ? p2.id : 'unknown');
      localStorage.setItem('difficulty', activeDiff ? activeDiff.dataset.diff : 'easy');

      window.location.href = 'fight.html';
    }

    document.getElementById('start-arcade').addEventListener('click', startArcadeFight);

    // ─── Initialize ───
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof ROSTER !== 'undefined' && ROSTER.length > 0) {
            updateDisplay();
        } else {
            console.error("ROSTER is empty. Cannot initialize character selection.");
        }
        if (typeof BackgroundAnimation !== 'undefined') {
            new BackgroundAnimation();
        }
    });
  </script>
</body>
</html>
