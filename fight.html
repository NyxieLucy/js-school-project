<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SOUK BRAWL — FIGHT!</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
.fight-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 2;
  width: 100%;
}

.fight-hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 900px;
  padding: 12px 16px;
  gap: 12px;
  position: relative;
  z-index: 10;
}

.hud-side {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.hud-side.right { align-items: flex-end; }

.hud-name {
  font-size: 10px;
  color: #f7b801;
  letter-spacing: 2px;
}

.hud-name-ar {
  font-size: 7px;
  color: #00d9ff;
}

.health-bar-wrap {
  width: 100%;
  height: 18px;
  background: #1a1a2e;
  border: 2px solid #f7b801;
  position: relative;
  overflow: hidden;
  clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 4px 100%, 0 calc(100% - 4px));
}

.health-bar {
  height: 100%;
  background: #ff6b35;
  transition: width 0.25s ease-out;
  position: relative;
}

.health-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: rgba(255,255,255,0.3);
}

.health-bar.danger {
  background: #FF3030;
  animation: danger-pulse 0.5s ease-in-out infinite alternate;
}

@keyframes danger-pulse {
  from { opacity: 1; }
  to { opacity: 0.6; }
}

.hud-side.right .health-bar-wrap { border-color: #00d9ff; }
.hud-side.right .health-bar { background: #00d9ff; }
.hud-side.right .health-bar.danger { background: #30FFFF; }

.hud-timer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 70px;
}

.timer-value {
  font-size: 22px;
  color: #f7b801;
  letter-spacing: 2px;
  text-shadow: 2px 2px 0 #000;
}

.timer-label {
  font-size: 6px;
  color: #f7b801;
  letter-spacing: 2px;
}

.round-indicator {
  position: absolute;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: #f7b801;
  letter-spacing: 4px;
  z-index: 10;
  text-align: center;
}

.round-indicator .round-ar {
  font-size: 8px;
  color: #00d9ff;
  margin-top: 2px;
}

.stage-area {
  position: relative;
  width: 100%;
  max-width: 900px;
  flex: 1;
  min-height: 420px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
  border-top: 3px solid #f7b801;
  border-bottom: 3px solid #f7b801;
}

.stage-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center bottom;
  image-rendering: pixelated;
  z-index: 0;
}

.stage-floor-overlay {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 100px;
  background: linear-gradient(to top, rgba(8,4,4,0.9) 0%, transparent 100%);
  z-index: 1;
  pointer-events: none;
}

.stage-name-overlay {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 4;
  background: rgba(8, 4, 4, 0.7);
  padding: 6px 16px;
  border: 1px solid #f7b801;
}

.stage-name-text {
  font-size: 8px;
  color: #f7b801;
  letter-spacing: 3px;
}

.stage-name-ar {
  font-size: 7px;
  color: #00d9ff;
  margin-top: 2px;
}

/* Fighter Arena - CRITICAL: arena-fighter is absolute positioned */
.fighter-arena {
  position: relative;
  width: 100%;
  max-width: 800px;
  height: 280px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 100px 25px;
  z-index: 5;
}

.arena-fighter {
  position: absolute;
  bottom: 25px;
  width: 220px;
  height: 220px;
}

.arena-fighter.left { left: 10%; }
.arena-fighter.right { right: 10%; }

/* Sprite wrapper - NO CSS transforms. All transforms come from JS */
.fighter-sprite-arena {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  position: relative;
}

.fighter-sprite-arena img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: bottom center;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* NO transform rules here - JS handles all transforms via inline styles */

.fighter-shadow-arena {
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 18px;
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  filter: blur(4px);
}

.super-meter-wrap {
  width: 100%;
  height: 8px;
  background: #1a1a2e;
  border: 1px solid #f7b801;
  margin-top: 4px;
  position: relative;
  overflow: hidden;
}

.super-meter {
  height: 100%;
  background: #f7b801;
  width: 0%;
  transition: width 0.2s;
  box-shadow: 0 0 6px #f7b801;
}

.super-label {
  font-size: 6px;
  color: #f7b801;
  letter-spacing: 1px;
  margin-top: 2px;
}

.combo-display {
  position: absolute;
  top: 100px;
  font-size: 14px;
  color: #f7b801;
  letter-spacing: 2px;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.3s;
  text-align: center;
}

.combo-display.active { opacity: 1; }
.combo-display.left { left: 20px; }
.combo-display.right { right: 20px; }

.combo-count {
  font-size: 28px;
  color: #ff6b35;
  text-shadow: 2px 2px 0 #000;
  line-height: 1;
}

.combo-hits {
  font-size: 10px;
  color: #f7b801;
}

.fight-message {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 52px;
  color: #ff6b35;
  text-shadow:
    4px 4px 0 #000,
    8px 8px 0 #1A0000;
  letter-spacing: 6px;
  z-index: 20;
  animation: fight-zoom 0.8s ease-out forwards;
  pointer-events: none;
  white-space: nowrap;
}

@keyframes fight-zoom {
  from { transform: translate(-50%, -50%) scale(3); opacity: 0; }
  to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.fight-message.fade {
  animation: fight-fade 0.5s ease-in forwards;
}

@keyframes fight-fade {
  to { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
}

.ko-message {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 72px;
  color: #ff6b35;
  text-shadow:
    4px 4px 0 #000,
    8px 8px 0 #1A0000;
  letter-spacing: 8px;
  z-index: 20;
  animation: ko-bounce 1s ease-out forwards;
}

@keyframes ko-bounce {
  0% { transform: translate(-50%, -50%) scale(0); }
  50% { transform: translate(-50%, -50%) scale(1.2); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

.perfect-message {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 32px;
  color: #f7b801;
  text-shadow: 3px 3px 0 #000;
  letter-spacing: 4px;
  z-index: 20;
  animation: perfect-pop 1s ease-out forwards;
}

@keyframes perfect-pop {
  0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
  60% { transform: translate(-50%, -50%) scale(1.1) rotate(2deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
}

.pause-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 4, 4, 0.9);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 100;
}

.pause-overlay.active { display: flex; }

.pause-title {
  font-size: 24px;
  color: #f7b801;
  letter-spacing: 4px;
  margin-bottom: 20px;
  text-shadow: 3px 3px 0 #000;
}

.pause-btn {
  background: #1a1a2e;
  border: 2px solid #f7b801;
  color: #fff;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  cursor: pointer;
  padding: 12px 32px;
  min-width: 220px;
  text-align: center;
  text-decoration: none;
  transition: all 0.1s;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}

.pause-btn:hover {
  border-color: #f7b801;
  color: #f7b801;
  background: #16213e;
}

.fight-controls {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 10px;
  font-size: 7px;
  color: #f7b801;
  letter-spacing: 1px;
  flex-wrap: wrap;
}

.ctrl-hint {
  display: flex;
  align-items: center;
  gap: 6px;
}

.win-dots {
  display: flex;
  gap: 4px;
  margin-top: 4px;
}

.win-dot {
  width: 8px; height: 8px;
  border: 1px solid #f7b801;
  background: transparent;
}

.win-dot.active {
  background: #f7b801;
  border-color: #f7b801;
  box-shadow: 0 0 4px #f7b801;
}

.hud-side.right .win-dot.active {
  background: #00d9ff;
  border-color: #00d9ff;
  box-shadow: 0 0 4px #00d9ff;
}
</style>
<base target="_blank">
</head>

<body>

<canvas id="bg-canvas"></canvas>

<div class="fight-screen" id="fight-screen">

<div class="round-indicator" id="round-indicator">
  <div>ROUND 1</div>
  <div class="round-ar">الجولة الأولى</div>
</div>

<div class="combo-display left" id="combo-p1">
  <div class="combo-count" id="combo-count-p1">0</div>
  <div class="combo-hits">HITS</div>
</div>

<div class="combo-display right" id="combo-p2">
  <div class="combo-count" id="combo-count-p2">0</div>
  <div class="combo-hits">HITS</div>
</div>

<div class="fight-hud">

  <div class="hud-side left">
    <div class="hud-name" id="p1-name">ISSAM</div>
    <div class="hud-name-ar" id="p1-name-ar">عصام</div>
    <div class="health-bar-wrap">
      <div class="health-bar" id="health-p1" style="width: 100%"></div>
    </div>
    <div class="super-meter-wrap">
      <div class="super-meter" id="super-p1" style="width: 0%"></div>
    </div>
    <div class="super-label">SUPER</div>
    <div class="win-dots" id="wins-p1">
      <div class="win-dot"></div>
      <div class="win-dot"></div>
    </div>
  </div>

  <div class="hud-timer">
    <div class="timer-value" id="timer">60</div>
    <div class="timer-label">TIME</div>
  </div>

  <div class="hud-side right">
    <div class="hud-name" id="p2-name">CHEB ARBI</div>
    <div class="hud-name-ar" id="p2-name-ar">الشاب العربي</div>
    <div class="health-bar-wrap">
      <div class="health-bar" id="health-p2" style="width: 100%"></div>
    </div>
    <div class="super-meter-wrap">
      <div class="super-meter" id="super-p2" style="width: 0%"></div>
    </div>
    <div class="super-label">SUPER</div>
    <div class="win-dots" id="wins-p2">
      <div class="win-dot"></div>
      <div class="win-dot"></div>
    </div>
  </div>

</div>

<div class="stage-area" id="stage-area">

  <img class="stage-bg-img" id="stage-bg-img" src="assets/stages/djemaa.png" alt="Stage" />

  <div class="stage-floor-overlay"></div>

  <div class="stage-name-overlay">
    <div class="stage-name-text" id="stage-name-fight">DJEMAA EL-FNA</div>
    <div class="stage-name-ar" id="stage-ar-fight">ساحة جامع الفنا</div>
  </div>

  <div class="fighter-arena">

    <div class="arena-fighter left">
      <div class="fighter-sprite-arena" id="sprite-p1-wrap">
        <img id="sprite-p1" src="assets/characters/issam/idle.png" alt="P1" />
        <div class="fighter-shadow-arena"></div>
      </div>
    </div>

    <div class="arena-fighter right">
      <div class="fighter-sprite-arena" id="sprite-p2-wrap">
        <img id="sprite-p2" src="assets/characters/cheb-arbi/idle.png" alt="P2" />
        <div class="fighter-shadow-arena"></div>
      </div>
    </div>

  </div>

  <div id="message-layer"></div>

</div>

<div class="fight-controls">
  <div class="ctrl-hint"><span class="key">&#8593;&#8595;&#8592;&#8594;</span> MOVE</div>
  <div class="ctrl-hint"><span class="key">Z</span> PUNCH</div>
  <div class="ctrl-hint"><span class="key">X</span> KICK</div>
  <div class="ctrl-hint"><span class="key">C</span> BLOCK</div>
  <div class="ctrl-hint"><span class="key">V</span> SPECIAL</div>
  <div class="ctrl-hint"><span class="key">ESC</span> PAUSE</div>
</div>

</div>

<div class="pause-overlay" id="pause-menu">
  <div class="pause-title">PAUSED</div>
  <button class="pause-btn" id="resume-btn">RESUME</button>
  <button class="pause-btn" id="restart-btn">RESTART</button>
  <a href="index.html" class="pause-btn">QUIT TO MENU</a>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/input.js"></script>
<script src="js/character.js"></script>
<script src="js/main.js"></script>
<script src="js/fight.js"></script>

</body>
</html>
