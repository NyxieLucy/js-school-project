<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOUK BRAWL — Main Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
<base target="_blank">
</head>
<body>

  <!-- ═══════════════════════════════════════ ANIMATED BACKGROUND ═══ -->
  <canvas id="bg-canvas"></canvas>

  <!-- ═══════════════════════════════════════ MAIN MENU SCREEN ═══ -->
  <div id="screen-main" class="screen active">
    <div class="main-wrap">

      <!-- Title Block -->
      <div class="title-block">
        <div class="title-eyebrow">المملكة — KINGDOM FIGHTERS</div>
        <div class="title-logo">
          <span class="logo-souk">SOUK</span>
          <span class="logo-brawl">BRAWL</span>
        </div>
        <div class="title-sub">حرب السوق</div>
      </div>

      <!-- Single Character Showcase (1254x1254 ratio) -->
      <div class="hero-showcase">
        <div class="hero-stage">
          <div class="hero-shadow"></div>
          <div class="hero-sprite-wrap" id="hero-sprite-wrap">
            <img id="hero-sprite-img" src="assets/characters/issam/idle.png" alt="ISSAM" />
          </div>
          <div class="hero-name-plate">
            <div class="hero-name">ISSAM</div>
            <div class="hero-name-ar">عصام</div>
            <div class="hero-origin">CASABLANCA</div>
          </div>
        </div>

        <!-- Decorative frame corners -->
        <div class="stage-corner tl"></div>
        <div class="stage-corner tr"></div>
        <div class="stage-corner bl"></div>
        <div class="stage-corner br"></div>
      </div>

      <!-- Menu Navigation -->
      <nav class="menu-nav" id="main-menu">
        <a href="arcade.html" class="menu-item active" data-action="arcade">
          <span class="item-cursor">&#9658;</span>
          <span class="item-text">ARCADE MODE</span>
          <span class="item-tag">1P</span>
        </a>
        <a href="versus.html" class="menu-item" data-action="vs">
          <span class="item-cursor">&#9658;</span>
          <span class="item-text">VS MODE</span>
          <span class="item-tag">2P</span>
        </a>
        <a href="story.html" class="menu-item" data-action="story">
          <span class="item-cursor">&#9658;</span>
          <span class="item-text">STORY MODE</span>
          <span class="item-tag">1P</span>
        </a>
        <a href="survival.html" class="menu-item" data-action="survival">
          <span class="item-cursor">&#9658;</span>
          <span class="item-text">SURVIVAL</span>
          <span class="item-tag">1P</span>
        </a>
        <a href="training.html" class="menu-item" data-action="training">
          <span class="item-cursor">&#9658;</span>
          <span class="item-text">TRAINING</span>
          <span class="item-tag">1P</span>
        </a>
        <a href="options.html" class="menu-item" data-action="options">
          <span class="item-cursor">&#9658;</span>
          <span class="item-text">OPTIONS</span>
          <span class="item-tag"></span>
        </a>
      </nav>

      <!-- Bottom Bar -->
      <div class="bottom-bar">
        <div class="key-hint"><span class="key">Z</span> SELECT</div>
        <div class="insert-coin">-- INSERT COIN --</div>
        <div class="key-hint"><span class="key">X</span> BACK</div>
      </div>

    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
